name: Python tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install core and geospatial test dependencies
        run: python -m pip install -e ".[ml,geo,web,dev]"
      - name: Test
        run: python -m pytest -q
