[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geovalue"
version = "0.1.0"
description = "Geospatial housing value prediction and multivariable calculus analysis"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
]

[project.optional-dependencies]
ml = [
  "scikit-learn>=1.5,<2",
  "xgboost>=2.1,<4",
  "joblib>=1.4,<2",
]
geo = [
  "scipy>=1.13,<2",
  "matplotlib>=3.8,<4",
  "pyproj>=3.6,<4",
  "folium>=0.17,<1",
  "plotly>=5.24,<7",
]
web = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
]

[project.scripts]
geovalue = "geovalue.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
