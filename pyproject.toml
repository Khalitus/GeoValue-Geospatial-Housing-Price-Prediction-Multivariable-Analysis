[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geovalue"
version = "0.6.0"
description = "Geospatial housing value prediction and multivariable calculus analysis"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy==2.5.4",
  "pandas==2.3.3",
  "scikit-learn==1.9.1",
  "xgboost==3.4.1",
  "joblib==1.6.0",
  "fastapi>=0.115,<1",
]

[project.optional-dependencies]
ml = [
  "scikit-learn==1.9.1",
  "xgboost==3.4.1",
  "joblib==1.6.0",
]
geo = [
  "scipy>=1.13,<2",
  "matplotlib>=3.8,<4",
  "pyproj==3.6.1",
  "folium>=0.17,<1",
  "plotly>=5.24,<7",
]
web = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "httpx>=0.27,<1",
]

[project.scripts]
geovalue = "geovalue.cli:main"
geovalue-official = "geovalue.official.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
